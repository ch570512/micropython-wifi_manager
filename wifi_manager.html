<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>WiFi Setup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 2rem
        }

        .card {
            background: #1E1E28;
            border-radius: 16px;
            padding: 1.75rem 1.5rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .4), 0 8px 32px rgba(0, 0, 0, .6);
            border: 1px solid #1e1e2a
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: .25rem;
            color: #50d2ff
        }

        p.sub {
            color: #c8c8c8;
            font-size: .875rem;
            margin-bottom: 1.5rem
        }

        .net-list {
            margin-bottom: 1.25rem;
            max-height: 192px;
            overflow-y: auto
        }

        .net-item {
            padding: .5rem .75rem;
            margin-bottom: 4px;
            cursor: pointer;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #c8c8c8;
            font-size: .875rem
        }

        .net-item:hover {
            border-color: #50d2ff;
            color: #fff
        }

        .net-none {
            cursor: default;
            color: #666
        }

        label {
            display: block;
            font-size: .75rem;
            font-weight: 500;
            letter-spacing: .05em;
            margin-bottom: .25rem;
            text-transform: uppercase;
            color: #c8c8c8
        }

        input[type=text],
        input[type=password] {
            width: 100%;
            padding: .75rem 1rem;
            margin-bottom: 1rem;
            background: #000;
            border: 1px solid #333;
            border-radius: 4px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit
        }

        input[type=text]:focus,
        input[type=password]:focus {
            outline: none;
            border-color: #50d2ff
        }

        button {
            width: 100%;
            padding: .75rem 1rem;
            margin-top: .5rem;
            background: #50d2ff;
            color: #000;
            border: none;
            border-radius: 20px;
            font-size: .875rem;
            font-weight: 600;
            letter-spacing: .0125em;
            text-transform: uppercase;
            cursor: pointer
        }

        button:hover {
            background: #7adeff
        }

        button:active {
            background: #3bbce8
        }
    </style>
    <script>
        function setSsid(name) { document.getElementById('ssid').value = name; document.getElementById('password').focus() }
    </script>
</head>

<body>
    <div class="card">
        <h1>&#x1f6dc; WiFi Setup</h1>
        <p class="sub">Select a network or enter one manually</p>
        <div class="net-list">
            {{NETWORKS}}</div>
        <a href="/?rescan=1"
            style="display:block;text-align:right;color:#50d2ff;font-size:.8rem;text-decoration:none;margin-bottom:.75rem">&#x1f504;
            Rescan</a>
        <form method="POST" action="/">
            <label for="ssid">SSID</label>
            <input type="text" id="ssid" name="ssid" placeholder="WiFi name" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="WiFi password">
            <button type="submit">Save &amp; Reboot</button>
        </form>
    </div>
</body>

</html>
